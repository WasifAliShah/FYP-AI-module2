name: Build & Push AI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Note: AI images can be large. GitHub Actions has a 14GB disk limit.
      # If you hit storage issues later, we can add a step to clear disk space.
      - name: Build and push AI Pipeline
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Make sure to create this repository in your DockerHub if it doesn't exist
          tags: sabbas30/visionindex-frontend:ai
